[workspace]
resolver = "2"
members = ["bench","core", "midi-io", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# `core` es el dominio headless (reloj, linea temporal, feedforward). No depende de
# Tauri ni de la interfaz: esa separacion es el Principio III de la Constitucion y se
# verifica con `cargo tree -p core`.
