[package]
name = "piano-midi-io"
version.workspace = true
edition.workspace = true
description = "Adaptador de entrada MIDI de Piano Tutor. La unica capa que habla con el sistema operativo."

[lib]
name = "piano_midi_io"
path = "src/lib.rs"

[dependencies]
piano-core = { path = "../core" }

# Prioridad del hilo consumidor. Vive AQUI y no en el nucleo porque arrastra `libc` y
# `log`, dos de las dependencias que la puerta del Principio III prohibe expresamente en
# `piano-core`. Subir la prioridad de un hilo es una llamada al sistema: es cosa de la capa
# de plataforma aunque no tenga nada que ver con MIDI.
thread-priority = "3.1.1"

# macOS: CoreMIDI directamente. NO se usa midir: aborta el proceso ante un paquete
# truncado en la ruta exacta de note-on (issue #160). Ver research.md, Decision 1.
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.2"

# Windows: WinRT (Windows.Devices.Midi). NO WinMM: toda su API en este crate es
# `pub unsafe fn`, y este crate tiene `forbid(unsafe_code)`, que no se levanta con un
# `allow` local. Ver la enmienda en specs/002-midi-input-capture/research.md, Decision 1.
# No es una dependencia nueva: es la misma, con otras features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Devices_Midi",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
] }
