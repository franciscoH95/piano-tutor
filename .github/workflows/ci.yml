# Ejecuta las mismas puertas que el hook local, en las dos plataformas objetivo.
#
# ACTIVA desde el 2026-08-18 en github.com/franciscoH95/piano-tutor.
#
# Ejecuta exactamente el mismo `scripts/verificar.sh` que el hook local. Que sea el mismo
# script no es casualidad: si la CI hiciera otra cosa, verde en local dejaria de significar
# verde en CI.
#
# Estas dos comprobaciones son OBLIGATORIAS en `main` desde el 2026-08-18: la rama esta
# protegida y no se puede incorporar nada que no las pase. Force-push y borrado de rama,
# deshabilitados.
#
# Matiz: `enforce_admins` esta en false, asi que quien administra el repositorio puede
# saltarselas a sabiendas. La puerta protege de los descuidos, no de las decisiones
# deliberadas; eso es todo lo que una puerta puede hacer.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # La puerta 4 ejecuta las pruebas de la interfaz. El runner no trae `pnpm`, y sin el
      # `verificar.sh` moria con "command not found" DESPUES de haber pasado las tres
      # primeras puertas: parecia un fallo del proyecto y era del entorno.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Puertas del proyecto
        shell: bash
        run: ./scripts/verificar.sh
